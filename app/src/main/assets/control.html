<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NOVA A1 ROBOT CONTROLLER</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts for Mono styling -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    html, body {
      overflow: hidden;
      height: 100%;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      /* Prevent pull-to-refresh, zooming, and text selection on mobile */
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      
      /* Safe Area for notches and gesture navs */
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    
    /* Tech Button Active States */
    .tech-btn-active {
      background-color: #06b6d4 !important; /* cyan-500 */
      color: #111827 !important; /* gray-900 */
      border-color: #22d3ee !important; /* cyan-400 */
      box-shadow: 0 0 20px rgba(34,211,238,0.8), inset 0 0 20px rgba(34,211,238,0.5) !important;
      transform: scale(0.95) !important;
    }

    button {
      touch-action: manipulation;
    }

    .tech-btn {
      min-width: 44px; /* Maintain safe minimum touch target */
      min-height: 44px;
      transition: all 0.08s ease;
    }

    /* Hardware Controller Hold Feedback */
    .tech-btn:active {
      transform: scale(0.92) !important;
      box-shadow: 0 0 25px rgba(34,211,238,0.9) !important;
    }

    /* LED Color Buttons */
    .led-btn {
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .led-btn:active {
      transform: scale(0.85);
    }
    .led-btn-active {
      transform: scale(1.15) !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 12px #ffffff !important;
    }

    /* Landscape Auto-Hide Header */
    @media (orientation: landscape) {
      header {
        opacity: 0.3;
        transition: opacity 0.3s ease;
      }
      header:hover {
        opacity: 1;
      }
      
      .landscape\:grid-cols-3 {
        grid-template-columns: 1fr auto 1fr;
      }

      .landscape\:grid-rows-1 {
        grid-template-rows: 1fr;
      }

      /* Make buttons bigger in landscape */
      .tech-btn {
        transform: scale(1.1);
      }
    }

    /* Portrait improvements */
    @media (orientation: portrait) {
      #hud-command-text {
        font-size: 14px !important;
      }
      .tech-btn {
        margin: 2px;
      }
    }
  </style>
</head>
<body class="fixed inset-0 bg-gray-950 text-cyan-400 overflow-hidden flex flex-col">

  <!-- J.A.R.V.I.S Background Grid & Scanlines -->
  <div class="absolute inset-0 bg-[linear-gradient(rgba(34,211,238,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(34,211,238,0.05)_1px,transparent_1px)] bg-[size:20px_20px] md:bg-[size:40px_40px] pointer-events-none z-0"></div>
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_0%,rgba(3,7,18,0.8)_100%)] pointer-events-none z-0"></div>
  
  <!-- Top HUD Header -->
  <header class="relative flex justify-between items-center p-1 md:p-3 border-b border-cyan-500/30 bg-gray-900/50 backdrop-blur-md z-10 flex-shrink-0">
    <div class="flex items-center gap-2 md:gap-4">
      
      <!-- Back Button -->
      <button onclick="window.location.href='controller.html'" class="flex items-center justify-center p-1 sm:p-2 border border-cyan-500/50 rounded-lg bg-gray-900/60 hover:bg-cyan-900/40 text-cyan-400 active:scale-95 transition-all shadow-[inset_0_0_10px_rgba(34,211,238,0.1)] mr-1 md:mr-2">
        <i data-lucide="chevron-left" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        <span class="hidden sm:inline-block pr-1 text-[10px] md:text-xs font-bold tracking-widest">BACK</span>
      </button>

      <div id="conn-spinner-outer" class="w-8 h-8 md:w-12 md:h-12 rounded-full border-2 flex items-center justify-center animate-[spin_4s_linear_infinite] border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.3)]">
        <div id="conn-spinner-inner" class="w-5 h-5 md:w-8 md:h-8 border-t-2 border-r-2 rounded-full animate-[spin_2s_linear_infinite_reverse] border-red-400"></div>
      </div>
      <div>
        <h1 class="text-xs sm:text-sm md:text-xl font-bold tracking-[0.1em] md:tracking-[0.2em] text-cyan-300 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">NOVA A1 ROBOT CONTROLLER</h1>
        <p id="conn-status-text" class="text-[8px] md:text-xs tracking-widest text-red-500 animate-pulse">SEEKING SIGNAL...</p>
      </div>
    </div>
    <div class="hidden sm:flex gap-4 md:gap-6 text-xs md:text-sm">
      <div class="flex items-center gap-1 md:gap-2">
        <i data-lucide="wifi" id="wifi-icon" class="w-4 h-4 text-red-500"></i>
        <span id="rssi-text">0 dBm</span>
      </div>
      <div class="flex items-center gap-1 md:gap-2"><i data-lucide="cpu" class="w-4 h-4"></i> <span>42°C</span></div>
      <div class="flex items-center gap-1 md:gap-2"><i data-lucide="battery-charging" class="w-4 h-4"></i> <span>98%</span></div>
    </div>
  </header>

  <!-- Main Interface Grid (Fluid Adaptive) -->
  <main class="flex-1 relative z-10 w-full min-h-0 grid grid-cols-2 grid-rows-[auto_1fr] landscape:grid-cols-[1fr_min-content_1fr] landscape:grid-rows-1 gap-2 p-2 md:p-6 items-center justify-items-center">
    
    <!-- CENTER PANEL: Head Pan & LED Control -->
    <div class="col-span-2 landscape:col-span-1 landscape:col-start-2 row-start-1 flex flex-col items-center justify-center w-full min-h-0 relative shrink-0">
      
      <!-- Outer rotating ring (Fluid VMIN) -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <svg class="w-[30vmin] h-[30vmin] max-w-[200px] max-h-[200px] animate-[spin_10s_linear_infinite] opacity-30" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-dasharray="4 4" />
          <circle cx="50" cy="50" r="42" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="10 20" />
        </svg>
      </div>
      
      <!-- Head & Optics Control Box -->
      <div class="relative z-10 flex flex-col items-center justify-center w-full max-w-[280px] p-2">
        <div class="text-[10px] md:text-xs tracking-[0.3em] font-bold text-cyan-500 opacity-80 mb-2 md:mb-3 bg-gray-950/60 px-4 py-1 rounded-full border border-cyan-500/30 shadow-[0_0_10px_rgba(34,211,238,0.1)] backdrop-blur-sm">HEAD & OPTICS</div>
        
        <!-- Pan Controls -->
        <div class="flex gap-4 md:gap-8 w-full justify-center mb-3 md:mb-4">
          <button class="tech-btn relative flex items-center justify-center backdrop-blur-sm border-2 border-cyan-500/30 shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] bg-gray-900/60 text-cyan-400 w-[14vmin] h-[9vmin] max-w-[80px] max-h-[50px] rounded-l-2xl" data-cmd="HEAD_LEFT">
            <div class="absolute top-0 left-0 w-1.5 h-1.5 md:w-2 md:h-2 border-t-2 border-l-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-1.5 h-1.5 md:w-2 md:h-2 border-b-2 border-r-2 border-cyan-400"></div>
            <i data-lucide="chevron-left" class="w-[50%] h-[50%]"></i>
          </button>
          <button class="tech-btn relative flex items-center justify-center backdrop-blur-sm border-2 border-cyan-500/30 shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] bg-gray-900/60 text-cyan-400 w-[14vmin] h-[9vmin] max-w-[80px] max-h-[50px] rounded-r-2xl" data-cmd="HEAD_RIGHT">
            <div class="absolute top-0 left-0 w-1.5 h-1.5 md:w-2 md:h-2 border-t-2 border-l-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-1.5 h-1.5 md:w-2 md:h-2 border-b-2 border-r-2 border-cyan-400"></div>
            <i data-lucide="chevron-right" class="w-[50%] h-[50%]"></i>
          </button>
        </div>

        <!-- LED Color Modal Trigger -->
        <button id="led-modal-btn" class="tech-btn relative flex items-center justify-center backdrop-blur-sm border-2 border-cyan-500/30 shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] bg-gray-900/60 text-cyan-400 px-4 py-2 rounded-xl group hover:border-cyan-400 transition-all w-[32vmin] max-w-[192px]">
          <i data-lucide="palette" class="w-4 h-4 md:w-5 md:h-5 mr-2 text-cyan-500 group-hover:text-cyan-300 group-hover:animate-pulse"></i>
          <span class="text-[10px] md:text-xs font-bold tracking-[0.2em]">LED CONTROL</span>
        </button>

      </div>
    </div>

    <!-- LEFT PANEL: Speed & Base Movement -->
    <div class="col-span-1 landscape:col-start-1 row-start-2 landscape:row-start-1 flex flex-row portrait:flex-col landscape:flex-row items-center justify-start pl-1 sm:pl-2 gap-2 sm:gap-4 md:gap-8 w-full h-full min-h-0">
      
      <!-- Speed Controller -->
      <div class="flex flex-col items-center justify-end landscape:justify-center h-full min-h-0 pb-1">
        <div class="text-[8px] md:text-xs tracking-[0.2em] text-cyan-500 opacity-70 mb-1 border-b border-cyan-500/30 pb-0.5">THRUST</div>
        <div id="speed-bars-container" class="flex flex-col-reverse gap-[2px] h-[35vmin] max-h-[220px] bg-gray-900/50 p-1 md:p-2 border border-cyan-500/30 rounded-full w-[6vmin] min-w-[32px] max-w-[40px] shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] relative">
          <!-- JS will inject speed bars here -->
        </div>
        <div id="speed-text" class="mt-1 font-bold text-[10px] md:text-sm drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">50%</div>
      </div>

      <!-- Movement D-PAD (Fluid Grid) -->
      <div class="flex flex-col items-center">
        <div class="text-[8px] md:text-xs tracking-[0.2em] text-cyan-500 opacity-70 mb-1 border-b border-cyan-500/30 pb-0.5">DIRECTIONAL</div>
        <div class="grid grid-cols-3 grid-rows-3 gap-1 sm:gap-2 w-[45vmin] h-[45vmin] max-w-[260px] max-h-[260px]">
          <div></div>
          <button class="tech-btn relative flex items-center justify-center backdrop-blur-sm border-2 border-cyan-500/30 shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] bg-gray-900/40 text-cyan-400 rounded-t-xl" data-cmd="FORWARD">
            <div class="absolute top-0 left-0 w-1.5 h-1.5 md:w-2 md:h-2 border-t-2 border-l-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-1.5 h-1.5 md:w-2 md:h-2 border-b-2 border-r-2 border-cyan-400"></div>
            <i data-lucide="chevron-up" class="w-[50%] h-[50%]"></i>
          </button>
          <div></div>
          
          <button class="tech-btn relative flex items-center justify-center backdrop-blur-sm border-2 border-cyan-500/30 shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] bg-gray-900/40 text-cyan-400 rounded-l-xl" data-cmd="LEFT">
            <div class="absolute top-0 left-0 w-1.5 h-1.5 md:w-2 md:h-2 border-t-2 border-l-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-1.5 h-1.5 md:w-2 md:h-2 border-b-2 border-r-2 border-cyan-400"></div>
            <i data-lucide="chevron-left" class="w-[50%] h-[50%]"></i>
          </button>
          
          <!-- STOP BUTTON CENTERED -->
          <button id="stop-btn" class="flex items-center justify-center border-2 border-red-500/30 rounded-full bg-gray-900/50 shadow-[inset_0_0_20px_rgba(239,68,68,0.2)] hover:bg-red-900/40 hover:border-red-500 active:scale-95 transition-all relative group cursor-pointer z-20">
            <i data-lucide="octagon" id="dpad-target" class="w-[45%] h-[45%] text-red-500/60 group-hover:text-red-400 transition-all fill-red-500/10"></i>
          </button>
          
          <button class="tech-btn relative flex items-center justify-center backdrop-blur-sm border-2 border-cyan-500/30 shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] bg-gray-900/40 text-cyan-400 rounded-r-xl" data-cmd="RIGHT">
            <div class="absolute top-0 left-0 w-1.5 h-1.5 md:w-2 md:h-2 border-t-2 border-l-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-1.5 h-1.5 md:w-2 md:h-2 border-b-2 border-r-2 border-cyan-400"></div>
            <i data-lucide="chevron-right" class="w-[50%] h-[50%]"></i>
          </button>
          
          <div></div>
          <button class="tech-btn relative flex items-center justify-center backdrop-blur-sm border-2 border-cyan-500/30 shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] bg-gray-900/40 text-cyan-400 rounded-b-xl" data-cmd="BACKWARD">
            <div class="absolute top-0 left-0 w-1.5 h-1.5 md:w-2 md:h-2 border-t-2 border-l-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-1.5 h-1.5 md:w-2 md:h-2 border-b-2 border-r-2 border-cyan-400"></div>
            <i data-lucide="chevron-down" class="w-[50%] h-[50%]"></i>
          </button>
          <div></div>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Arm Controls (Fluid VMIN Buttons) -->
    <div class="col-span-1 landscape:col-start-3 row-start-2 landscape:row-start-1 flex flex-row portrait:flex-col landscape:flex-row items-center justify-end pr-1 sm:pr-2 gap-2 sm:gap-4 md:gap-6 w-full h-full min-h-0">
      
      <!-- Arm Select & Gestures Box -->
      <div class="flex flex-col items-center justify-end landscape:justify-center h-full gap-2 sm:gap-4 pb-1 md:pb-0">
        <!-- L/R Toggle Switch -->
        <div id="arm-toggle-btn" class="relative flex items-center w-[16vmin] h-[5vmin] max-w-[80px] max-h-[28px] min-w-[60px] min-h-[24px] bg-gray-900/80 border-2 border-cyan-500/50 rounded-full cursor-pointer shadow-[inset_0_0_10px_rgba(34,211,238,0.2)] overflow-hidden">
          <div id="arm-toggle-slider" class="absolute top-0 bottom-0 w-1/2 bg-cyan-500 transition-transform duration-300 ease-out translate-x-full"></div>
          <div id="arm-toggle-l" class="relative z-10 flex-1 text-center text-[10px] md:text-xs font-bold transition-colors text-cyan-500">L</div>
          <div id="arm-toggle-r" class="relative z-10 flex-1 text-center text-[10px] md:text-xs font-bold transition-colors text-gray-900">R</div>
        </div>

        <div class="flex flex-row portrait:flex-col gap-2">
          <!-- Handshake Gesture Action -->
          <button id="handshake-btn" class="tech-btn relative group w-[13vmin] h-[13vmin] max-w-[65px] max-h-[65px] flex flex-col items-center justify-center border-2 border-cyan-500/50 bg-gray-900/80 shadow-[inset_0_0_20px_rgba(34,211,238,0.2)] overflow-hidden hover:bg-cyan-900/30 hover:border-cyan-300 text-cyan-400 rounded-xl" style="clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);">
            <div class="absolute inset-0 bg-gradient-to-t from-cyan-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <i data-lucide="hand" id="handshake-icon" class="w-[50%] h-[50%] stroke-[1.5]"></i>
          </button>

          <!-- Home Base Action -->
          <button id="home-btn" class="tech-btn relative group w-[13vmin] h-[13vmin] max-w-[65px] max-h-[65px] flex flex-col items-center justify-center border-2 border-emerald-500/50 bg-gray-900/80 shadow-[inset_0_0_20px_rgba(16,185,129,0.2)] overflow-hidden hover:bg-emerald-900/30 hover:border-emerald-300 text-emerald-400 rounded-xl" style="clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);">
            <div class="absolute inset-0 bg-gradient-to-t from-emerald-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <i data-lucide="home" id="home-icon" class="w-[50%] h-[50%] stroke-[1.5]"></i>
          </button>
        </div>
      </div>

      <!-- Shoulder Up/Down (S2) -->
      <div class="flex flex-col items-center justify-end landscape:justify-center h-full pb-1 md:pb-0">
        <div class="flex flex-col gap-1 sm:gap-3">
          <button class="tech-btn relative flex items-center justify-center backdrop-blur-sm border-2 border-cyan-500/30 shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] bg-gray-900/40 text-cyan-400 w-[12vmin] h-[15vmin] max-w-[70px] max-h-[80px] rounded-t-2xl" data-cmd="ARM_SHOULDER_UP">
            <div class="absolute top-0 left-0 w-1.5 h-1.5 md:w-2 md:h-2 border-t-2 border-l-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-1.5 h-1.5 md:w-2 md:h-2 border-b-2 border-r-2 border-cyan-400"></div>
            <i data-lucide="chevron-up" class="w-[50%] h-[50%]"></i>
          </button>
          <button class="tech-btn relative flex items-center justify-center backdrop-blur-sm border-2 border-cyan-500/30 shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] bg-gray-900/40 text-cyan-400 w-[12vmin] h-[15vmin] max-w-[70px] max-h-[80px] rounded-b-2xl" data-cmd="ARM_SHOULDER_DOWN">
            <div class="absolute top-0 left-0 w-1.5 h-1.5 md:w-2 md:h-2 border-t-2 border-l-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-1.5 h-1.5 md:w-2 md:h-2 border-b-2 border-r-2 border-cyan-400"></div>
            <i data-lucide="chevron-down" class="w-[50%] h-[50%]"></i>
          </button>
        </div>
      </div>

      <!-- Elbow Up/Down (S3) -->
      <div class="flex flex-col items-center justify-end landscape:justify-center h-full pb-1 md:pb-0">
        <div class="flex flex-col gap-1 sm:gap-3">
          <button class="tech-btn relative flex items-center justify-center backdrop-blur-sm border-2 border-cyan-500/30 shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] bg-gray-900/40 text-cyan-400 w-[12vmin] h-[15vmin] max-w-[70px] max-h-[80px] rounded-t-2xl" data-cmd="ARM_ELBOW_UP">
            <div class="absolute top-0 left-0 w-1.5 h-1.5 md:w-2 md:h-2 border-t-2 border-l-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-1.5 h-1.5 md:w-2 md:h-2 border-b-2 border-r-2 border-cyan-400"></div>
            <i data-lucide="chevron-up" class="w-[50%] h-[50%]"></i>
          </button>
          <button class="tech-btn relative flex items-center justify-center backdrop-blur-sm border-2 border-cyan-500/30 shadow-[inset_0_0_15px_rgba(34,211,238,0.1)] bg-gray-900/40 text-cyan-400 w-[12vmin] h-[15vmin] max-w-[70px] max-h-[80px] rounded-b-2xl" data-cmd="ARM_ELBOW_DOWN">
            <div class="absolute top-0 left-0 w-1.5 h-1.5 md:w-2 md:h-2 border-t-2 border-l-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-1.5 h-1.5 md:w-2 md:h-2 border-b-2 border-r-2 border-cyan-400"></div>
            <i data-lucide="chevron-down" class="w-[50%] h-[50%]"></i>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer decorative border -->
  <footer class="h-1 w-full bg-gradient-to-r from-transparent via-cyan-500 to-transparent opacity-50 z-10 flex-shrink-0"></footer>

  <!-- LED Color Modal -->
  <div id="led-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="led-modal-content" class="bg-gray-900 border-2 border-cyan-500/50 rounded-2xl p-6 shadow-[0_0_40px_rgba(34,211,238,0.2)] w-[85vw] max-w-[320px] relative transform scale-95 transition-transform duration-300">
      
      <!-- Close Button -->
      <button id="led-modal-close" class="absolute top-2 right-2 p-1.5 text-cyan-500/50 hover:text-cyan-300 active:scale-90 transition-all rounded-full bg-gray-800 border border-transparent hover:border-cyan-500/50">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="text-[10px] md:text-xs tracking-[0.3em] font-bold text-cyan-500 mb-6 text-center border-b border-cyan-500/30 pb-3">LED PRESETS</div>
      
      <div class="grid grid-cols-3 gap-6 justify-items-center mb-6">
        <button class="led-btn w-12 h-12 rounded-full border-2 border-cyan-500/50 bg-[#00f2ff] shadow-[0_0_15px_#00f2ff]" data-r="0" data-g="242" data-b="255"></button>
        <button class="led-btn w-12 h-12 rounded-full border-2 border-red-500/50 bg-[#ff0000]" data-r="255" data-g="0" data-b="0"></button>
        <button class="led-btn w-12 h-12 rounded-full border-2 border-green-500/50 bg-[#00ff00]" data-r="0" data-g="255" data-b="0"></button>
        <button class="led-btn w-12 h-12 rounded-full border-2 border-blue-500/50 bg-[#0000ff]" data-r="0" data-g="0" data-b="255"></button>
        <button class="led-btn w-12 h-12 rounded-full border-2 border-yellow-400/50 bg-[#ffaa00]" data-r="255" data-g="170" data-b="0"></button>
        <button class="led-btn w-12 h-12 rounded-full border-2 border-purple-500/50 bg-[#ff00ff]" data-r="255" data-g="0" data-b="255"></button>
      </div>

      <!-- LED Off Button -->
      <button class="led-btn w-full flex items-center justify-center py-3 rounded-xl border border-gray-600 bg-gray-800 hover:bg-gray-700 active:scale-95 transition-all text-gray-400 group" data-r="0" data-g="0" data-b="0">
        <i data-lucide="power" class="w-5 h-5 mr-2 group-hover:text-red-400 transition-colors"></i>
        <span class="text-xs font-bold tracking-widest group-hover:text-gray-200 transition-colors">LEDS OFF</span>
      </button>
    </div>
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();
    
    // Custom Delay Helper
    const delay = ms => new Promise(res => setTimeout(res, ms));

    // --- State Management ---
    const state = {
      activeCommand: 'STANDBY',
      speed: 50,
      isConnected: false,
      robotIp: null,
      rssi: 0,
      activeArm: 'RIGHT',
      neck: 85, // Head servo (S3) starting position based on NOVA bounds
      joints: {
        left: { shoulder: 80, elbow: 110 },
        right: { shoulder: 90, elbow: 75 }
      }
    };

    let ws = null;
    let armInterval = null;
    let moveInterval = null; // Ultra-fast continuous poll

    // --- DOM Elements ---
    const ui = {
      connSpinnerOuter: document.getElementById('conn-spinner-outer'),
      connSpinnerInner: document.getElementById('conn-spinner-inner'),
      connStatusText: document.getElementById('conn-status-text'),
      wifiIcon: document.getElementById('wifi-icon'),
      rssiText: document.getElementById('rssi-text'),
      
      dpadTarget: document.getElementById('dpad-target'),
      stopBtn: document.getElementById('stop-btn'),
      
      speedBarsContainer: document.getElementById('speed-bars-container'),
      speedText: document.getElementById('speed-text'),
      
      armToggleBtn: document.getElementById('arm-toggle-btn'),
      armToggleSlider: document.getElementById('arm-toggle-slider'),
      armToggleL: document.getElementById('arm-toggle-l'),
      armToggleR: document.getElementById('arm-toggle-r'),
      
      handshakeBtn: document.getElementById('handshake-btn'),
      handshakeIcon: document.getElementById('handshake-icon'),
      homeBtn: document.getElementById('home-btn'),
      homeIcon: document.getElementById('home-icon'),
      
      techBtns: document.querySelectorAll('.tech-btn'),
      
      // LED Modal Elements
      ledModalBtn: document.getElementById('led-modal-btn'),
      ledModal: document.getElementById('led-modal'),
      ledModalContent: document.getElementById('led-modal-content'),
      ledModalClose: document.getElementById('led-modal-close'),
      ledBtns: document.querySelectorAll('.led-btn')
    };

    // --- Generate Speed Bars ---
    function initSpeedBars() {
      for (let i = 10; i >= 1; i--) {
        const level = i * 10;
        const bar = document.createElement('div');
        bar.className = 'flex-1 w-full rounded-sm cursor-pointer transition-all duration-200 speed-bar';
        bar.dataset.level = level;
        
        // Pointer events for speed slider
        const setSpd = (e) => {
          if(e.type === 'touchstart') e.preventDefault();
          handleSpeedChange(level);
        };
        bar.addEventListener('pointerdown', setSpd);
        
        ui.speedBarsContainer.appendChild(bar);
      }
      updateSpeedUI();
    }

    function updateSpeedUI() {
      document.querySelectorAll('.speed-bar').forEach(bar => {
        const level = parseInt(bar.dataset.level);
        if (state.speed >= level) {
          bar.classList.add(level > 70 ? 'bg-red-500' : 'bg-cyan-400');
          bar.classList.add(level > 70 ? 'shadow-[0_0_10px_rgba(239,68,68,0.8)]' : 'shadow-[0_0_10px_rgba(34,211,238,0.8)]');
          bar.classList.remove('bg-gray-800');
        } else {
          bar.classList.remove('bg-red-500', 'bg-cyan-400', 'shadow-[0_0_10px_rgba(239,68,68,0.8)]', 'shadow-[0_0_10px_rgba(34,211,238,0.8)]');
          bar.classList.add('bg-gray-800');
        }
      });
      ui.speedText.innerText = `${state.speed}%`;
    }

    // --- State Syncing ---
    function syncStateWithRobot(data) {
      if (!data) return;
      
      // Sync Servos
      // From Arduino config: S1(R.Elbow), S2(R.Shoulder), S3(Neck), S4(L.Shoulder), S5(L.Elbow)
      if (data.servos) {
        state.joints.right.elbow = data.servos.s1;
        state.joints.right.shoulder = data.servos.s2;
        state.neck = data.servos.s3;
        state.joints.left.shoulder = data.servos.s4;
        state.joints.left.elbow = data.servos.s5;
      }

      // Sync Speed
      if (data.motor && data.motor.speed !== undefined) {
        // Convert Arduino speed (0-255) to UI percentage (0-100)
        let percent = Math.round((data.motor.speed / 255) * 100);
        // Snap to nearest 10 for the UI bars
        percent = Math.round(percent / 10) * 10;
        if (percent === 0) percent = 10; // min 1 bar in UI
        state.speed = percent;
        updateSpeedUI();
      }

      // Sync LED colors
      if (data.led) {
        // Clear all active LED buttons
        ui.ledBtns.forEach(b => b.classList.remove('led-btn-active'));
        
        // Find matching button based on rgb response
        const r = data.led.r, g = data.led.g, b = data.led.b;
        const matchingBtn = Array.from(ui.ledBtns).find(btn => 
          parseInt(btn.dataset.r) === r && 
          parseInt(btn.dataset.g) === g && 
          parseInt(btn.dataset.b) === b
        );
        
        if (matchingBtn) {
          matchingBtn.classList.add('led-btn-active');
        }
      }
    }

    // --- Connection & WebSocket Logic ---
    let CURRENT_ESP_IP = "nova-robot.local";

    // Pre-fetch saved IP from Native Storage (If available via Android Launcher Bridge)
    if (window.AndroidLauncher && typeof window.AndroidLauncher.getSavedRobotIP === 'function') {
        CURRENT_ESP_IP = window.AndroidLauncher.getSavedRobotIP();
    }

    function sendCmd(cmdObj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(cmdObj));
      }
    }

    function connectWebSocket(ip) {
      if (ws) {
          ws.onclose = null; // Prevent overlapping reconnection loops
          ws.close();
      }

      try {
          ws = new WebSocket(`ws://${ip}/ws`);

          ws.onopen = () => {
              state.isConnected = true;
              updateConnectionUI(true);
          };

          ws.onclose = () => {
              sendCmd({ cmd: 'stop' }); // Dead-zone stop immediately
              state.isConnected = false;
              updateConnectionUI(false);
              ws = null;
          };

          ws.onerror = (e) => {
              console.error("WS Error", e);
              state.isConnected = false;
              updateConnectionUI(false);
              ws = null;
          };

          ws.onmessage = (e) => {
              if (e.data === 'ping') sendCmd({ cmd: 'pong' });
          };
      } catch (err) {
          console.error("Failed to init WS", err);
      }
    }

    async function findRobotIpInBackground() {
        // Re-sync IP from native bridge just in case it updated in another view
        if (window.AndroidLauncher && typeof window.AndroidLauncher.getSavedRobotIP === 'function') {
            CURRENT_ESP_IP = window.AndroidLauncher.getSavedRobotIP();
        }

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1000);

            let res = await fetch(`http://${CURRENT_ESP_IP}/status`, { signal: controller.signal });
            clearTimeout(timeoutId);

            let data = await res.json();

            // Using exact check to verify healthy response
            if (data && (data.status === "ok" || data.status === "connection_successful")) {
                // Update known IP if it changed during discovery
                if (data.ip_address && data.ip_address !== CURRENT_ESP_IP && window.AndroidLauncher && typeof window.AndroidLauncher.saveRobotIP === 'function') {
                    window.AndroidLauncher.saveRobotIP(data.ip_address);
                    CURRENT_ESP_IP = data.ip_address;
                }

                state.robotIp = CURRENT_ESP_IP;
                state.rssi = data.rssi_dbm;
                if(ui.rssiText) ui.rssiText.innerText = `${state.rssi} dBm`;

                // Connect or reconnect WebSocket if needed
                if (!ws || ws.readyState === WebSocket.CLOSED) {
                    connectWebSocket(CURRENT_ESP_IP);
                } else if (ws.url !== `ws://${CURRENT_ESP_IP}/ws` && ws.readyState !== WebSocket.CONNECTING) {
                    connectWebSocket(CURRENT_ESP_IP);
                }

                // Sync UI elements state with actual robot state, unless actively overriding
                if (state.activeCommand === 'STANDBY') {
                    syncStateWithRobot(data);
                }
            }
        } catch (e) {
            // Silently failing and retrying on next interval tick.
            // If we've completely dropped offline, adjust UI visually.
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                updateConnectionUI(false);
            }
        }
    }

    // Initialize background polling to find robot and maintain state
    let bgScanInterval = setInterval(findRobotIpInBackground, 2000);

    // Run once immediately on load
    findRobotIpInBackground();

    // --- Action Handlers ---
    function setActiveCommand(cmd) {
      state.activeCommand = cmd;
      updateHUD();
      updateTechButtons();
    }

    function startCommand(cmd) {
      if (navigator.vibrate) navigator.vibrate(10);
      setActiveCommand(cmd);

      if (moveInterval) clearInterval(moveInterval);
      
      // Fire immediately for zero lag
      if (cmd === 'FORWARD') sendCmd({ cmd: 'forward' });
      else if (cmd === 'BACKWARD') sendCmd({ cmd: 'backward' });
      else if (cmd === 'LEFT') sendCmd({ cmd: 'left' });
      else if (cmd === 'RIGHT') sendCmd({ cmd: 'right' });

      // Ultra-fast streaming polling interval
      moveInterval = setInterval(() => {
        if (cmd === 'FORWARD') sendCmd({ cmd: 'forward' });
        else if (cmd === 'BACKWARD') sendCmd({ cmd: 'backward' });
        else if (cmd === 'LEFT') sendCmd({ cmd: 'left' });
        else if (cmd === 'RIGHT') sendCmd({ cmd: 'right' });
      }, 100);
    }

    function stopCommand(e) {
      // Allow pointer events to safely process without spamming stop if already standby
      if (moveInterval) clearInterval(moveInterval);

      if (state.activeCommand !== 'HANDSHAKE INITIATED' && state.activeCommand !== 'HOME INITIATED' && state.activeCommand !== 'STANDBY') {
        setActiveCommand('STANDBY');
        sendCmd({ cmd: 'stop' });
      }
    }

    // Emergency/Manual Stop Button Handler
    function emergencyStop(e) {
      if (e) e.preventDefault();
      if (navigator.vibrate) navigator.vibrate([20, 20, 20]);
      
      if (moveInterval) clearInterval(moveInterval);
      setActiveCommand('STANDBY');
      sendCmd({ cmd: 'stop' });
    }

    async function handleHandshake(e) {
      if (e) e.preventDefault();
      if (state.activeCommand === 'HANDSHAKE INITIATED' || state.activeCommand === 'HOME INITIATED') return;
      
      if (navigator.vibrate) navigator.vibrate(10);
      setActiveCommand('HANDSHAKE INITIATED');
      
      // Right shoulder moves up to 130
      state.joints.right.shoulder = 130;
      sendCmd({ cmd: 'servo', s: 2, v: 130 });
      await delay(500);

      // Right elbow moves from 50 to 75, three times
      for(let i = 0; i < 3; i++) {
          state.joints.right.elbow = 50;
          sendCmd({ cmd: 'servo', s: 1, v: 50 }); // S1 is Right Elbow
          await delay(400);

          state.joints.right.elbow = 75;
          sendCmd({ cmd: 'servo', s: 1, v: 75 }); // S1 is Right Elbow
          await delay(400);
      }

      // Return Right Shoulder home
      state.joints.right.shoulder = 90;
      sendCmd({ cmd: 'servo', s: 2, v: 90 });
      
      // Cleanup visual state afterwards
      setTimeout(() => {
        if(state.activeCommand === 'HANDSHAKE INITIATED') setActiveCommand('STANDBY');
      }, 500);
    }

    // Home Sequence Handler (One by One Sequential Reset)
    async function handleHomeSequence(e) {
      if (e) e.preventDefault();
      if (state.activeCommand === 'HANDSHAKE INITIATED' || state.activeCommand === 'HOME INITIATED') return;
      
      if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
      setActiveCommand('HOME INITIATED');
      
      // Stop any motor movement
      sendCmd({ cmd: 'stop' });

      // Home angles configured in the C++ backend:
      // int pos[5] = {75, 90, 85, 80, 110}; // S1(R.Elbow), S2(R.Shoulder), S3(Neck), S4(L.Shoulder), S5(L.Elbow)
      const homePositions = [
        { s: 1, v: 75, jointGroup: 'right', jointType: 'elbow' },
        { s: 2, v: 90, jointGroup: 'right', jointType: 'shoulder' },
        { s: 3, v: 85, jointGroup: 'neck', jointType: null },
        { s: 4, v: 80, jointGroup: 'left', jointType: 'shoulder' },
        { s: 5, v: 110, jointGroup: 'left', jointType: 'elbow' }
      ];

      // Send each servos home angle one by one properly
      for (let i = 0; i < homePositions.length; i++) {
        const p = homePositions[i];
        
        // Update local state tracking so subsequent manual moves don't jump
        if (p.jointGroup === 'neck') state.neck = p.v;
        else state.joints[p.jointGroup][p.jointType] = p.v;

        // Dispatch over websocket
        sendCmd({ cmd: 'servo', s: p.s, v: p.v });
        
        // Wait sequence
        await delay(350); 
      }

      // Return to standby UI state
      setTimeout(() => {
        if(state.activeCommand === 'HOME INITIATED') setActiveCommand('STANDBY');
      }, 300);
    }

    function handleSpeedChange(level) {
      if (navigator.vibrate) navigator.vibrate(10);
      state.speed = level;
      sendCmd({ cmd: 'speed', v: Math.round((level / 100) * 255) });
      updateSpeedUI();
    }

    function toggleArm() {
      if (navigator.vibrate) navigator.vibrate(10);
      state.activeArm = state.activeArm === 'LEFT' ? 'RIGHT' : 'LEFT';
      updateArmToggleUI();
    }

    // --- Modal Logic ---
    function openLedModal() {
      if (navigator.vibrate) navigator.vibrate(10);
      ui.ledModal.classList.remove('opacity-0', 'pointer-events-none');
      ui.ledModalContent.classList.remove('scale-95');
    }

    function closeLedModal() {
      if (navigator.vibrate) navigator.vibrate(10);
      ui.ledModal.classList.add('opacity-0', 'pointer-events-none');
      ui.ledModalContent.classList.add('scale-95');
    }

    // --- Continuous Arm & Head Control Loop ---
    function startArmLoop() {
      armInterval = setInterval(() => {
        if (state.activeCommand.startsWith('ARM_')) {
          let targetServo = 0;
          let targetVal = 0;
          const side = state.activeArm.toLowerCase();

          // Correct servo mappings and limits from the NOVA Example
          let min = 0, max = 180;
          if (side === 'left' && state.activeCommand.includes('SHOULDER')) { targetServo = 4; min = 20; max = 80; }
          if (side === 'right' && state.activeCommand.includes('SHOULDER')) { targetServo = 2; min = 90; max = 145; }
          if (side === 'left' && state.activeCommand.includes('ELBOW')) { targetServo = 5; min = 110; max = 135; }
          if (side === 'right' && state.activeCommand.includes('ELBOW')) { targetServo = 1; min = 50; max = 75; }

          const jointStr = state.activeCommand.includes('SHOULDER') ? 'shoulder' : 'elbow';

          let isUp = state.activeCommand.endsWith('_UP');
          
          // Swap physical directions based on servo orientation
          if (side === 'right' && jointStr === 'elbow') {
              isUp = !isUp;
          }
          if (side === 'left' && jointStr === 'shoulder') {
              isUp = !isUp;
          }

          if (isUp) { 
            state.joints[side][jointStr] = Math.min(state.joints[side][jointStr] + 2, max); 
            targetVal = state.joints[side][jointStr]; 
          } else { 
            state.joints[side][jointStr] = Math.max(state.joints[side][jointStr] - 2, min); 
            targetVal = state.joints[side][jointStr]; 
          }

          if (targetServo > 0) {
            sendCmd({ cmd: 'servo', s: targetServo, v: targetVal });
          }
        } 
        else if (state.activeCommand.startsWith('HEAD_')) {
          // Head pan corresponds to Servo 3 with limits 35 to 150
          if (state.activeCommand === 'HEAD_LEFT') { 
            state.neck = Math.min(state.neck + 2, 150); 
          }
          if (state.activeCommand === 'HEAD_RIGHT') { 
            state.neck = Math.max(state.neck - 2, 35); 
          }
          sendCmd({ cmd: 'servo', s: 3, v: state.neck });
        }
      }, 50);
    }

    // --- UI Updaters ---
    function updateConnectionUI(connected) {
      if (connected) {
        ui.connSpinnerOuter.classList.replace('border-red-500', 'border-cyan-500');
        ui.connSpinnerOuter.classList.replace('shadow-[0_0_15px_rgba(239,68,68,0.3)]', 'shadow-[0_0_15px_rgba(34,211,238,0.3)]');
        ui.connSpinnerInner.classList.replace('border-red-400', 'border-cyan-300');
        
        ui.connStatusText.classList.replace('text-red-500', 'text-cyan-600');
        ui.connStatusText.classList.remove('animate-pulse');
        ui.connStatusText.innerText = `ONLINE // IP:${state.robotIp || CURRENT_ESP_IP}`;
        
        ui.wifiIcon.classList.replace('text-red-500', 'text-cyan-400');
      } else {
        ui.connSpinnerOuter.classList.replace('border-cyan-500', 'border-red-500');
        ui.connSpinnerOuter.classList.replace('shadow-[0_0_15px_rgba(34,211,238,0.3)]', 'shadow-[0_0_15px_rgba(239,68,68,0.3)]');
        ui.connSpinnerInner.classList.replace('border-cyan-300', 'border-red-400');
        
        ui.connStatusText.classList.replace('text-cyan-600', 'text-red-500');
        ui.connStatusText.classList.add('animate-pulse');
        ui.connStatusText.innerText = 'SEEKING SIGNAL...';
        
        ui.wifiIcon.classList.replace('text-cyan-400', 'text-red-500');
      }
    }

    function updateHUD() {
      const cmd = state.activeCommand;

      // Update Handshake styling
      if (cmd === 'HANDSHAKE INITIATED') {
        ui.handshakeBtn.classList.add('bg-cyan-500', 'text-gray-900', 'shadow-[0_0_30px_rgba(34,211,238,0.6)]');
        ui.handshakeBtn.classList.remove('bg-gray-900/80', 'text-cyan-400');
        ui.handshakeIcon.classList.add('animate-[bounce_0.5s_infinite]');
        ui.handshakeIcon.setAttribute('stroke-width', '2.5');
      } else {
        ui.handshakeBtn.classList.remove('bg-cyan-500', 'text-gray-900', 'shadow-[0_0_30px_rgba(34,211,238,0.6)]');
        ui.handshakeBtn.classList.add('bg-gray-900/80', 'text-cyan-400');
        ui.handshakeIcon.classList.remove('animate-[bounce_0.5s_infinite]');
        ui.handshakeIcon.setAttribute('stroke-width', '1.5');
      }

      // Update Home styling
      if (cmd === 'HOME INITIATED') {
        ui.homeBtn.classList.add('bg-emerald-500', 'text-gray-900', 'shadow-[0_0_30px_rgba(16,185,129,0.6)]');
        ui.homeBtn.classList.remove('bg-gray-900/80', 'text-emerald-400');
        ui.homeIcon.classList.add('animate-pulse');
        ui.homeIcon.setAttribute('stroke-width', '2.5');
      } else {
        ui.homeBtn.classList.remove('bg-emerald-500', 'text-gray-900', 'shadow-[0_0_30px_rgba(16,185,129,0.6)]');
        ui.homeBtn.classList.add('bg-gray-900/80', 'text-emerald-400');
        ui.homeIcon.classList.remove('animate-pulse');
        ui.homeIcon.setAttribute('stroke-width', '1.5');
      }
    }

    function updateTechButtons() {
      ui.techBtns.forEach(btn => {
        if (btn.dataset.cmd === state.activeCommand) {
          btn.classList.add('tech-btn-active');
          btn.classList.remove('bg-gray-900/40', 'text-cyan-400');
          // Increase stroke of SVG inside
          const icon = btn.querySelector('svg');
          if(icon) icon.setAttribute('stroke-width', '3');
        } else {
          // If it's a specific exception like Handshake or Home, ignore it from standard tech-btn toggles
          if (btn.id === 'handshake-btn' || btn.id === 'home-btn' || btn.id === 'led-modal-btn') return;

          btn.classList.remove('tech-btn-active');
          btn.classList.add('bg-gray-900/40', 'text-cyan-400');
          // Reset stroke of SVG inside
          const icon = btn.querySelector('svg');
          if(icon) icon.setAttribute('stroke-width', '2');
        }
      });
    }

    function updateArmToggleUI() {
      if (state.activeArm === 'RIGHT') {
        ui.armToggleSlider.classList.remove('translate-x-0');
        ui.armToggleSlider.classList.add('translate-x-full');
        ui.armToggleL.classList.replace('text-gray-900', 'text-cyan-500');
        ui.armToggleR.classList.replace('text-cyan-500', 'text-gray-900');
      } else {
        ui.armToggleSlider.classList.remove('translate-x-full');
        ui.armToggleSlider.classList.add('translate-x-0');
        ui.armToggleL.classList.replace('text-cyan-500', 'text-gray-900');
        ui.armToggleR.classList.replace('text-gray-900', 'text-cyan-500');
      }
    }

    // --- Attach Event Listeners ---
    function attachEventListeners() {
      // Direction, Head & Arm Buttons
      ui.techBtns.forEach(btn => {
        const cmd = btn.dataset.cmd;
        if (!cmd) return; // Ignore gesture buttons handled separately

        const startFn = (e) => { e.preventDefault(); startCommand(cmd); };
        
        btn.addEventListener('pointerdown', startFn);
        btn.addEventListener('pointerup', stopCommand);
        btn.addEventListener('pointerleave', stopCommand);
      });

      // Dedicated Action Buttons
      ui.stopBtn.addEventListener('pointerdown', emergencyStop);
      ui.handshakeBtn.addEventListener('pointerdown', handleHandshake);
      ui.homeBtn.addEventListener('pointerdown', handleHomeSequence);

      // Arm Toggle
      ui.armToggleBtn.addEventListener('click', toggleArm);

      // Modal Events
      ui.ledModalBtn.addEventListener('click', openLedModal);
      ui.ledModalClose.addEventListener('click', closeLedModal);
      ui.ledModal.addEventListener('click', (e) => {
        if (e.target === ui.ledModal) closeLedModal();
      });

      // LED Color Preset Buttons
      ui.ledBtns.forEach(btn => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (navigator.vibrate) navigator.vibrate(10);
          
          // Clear active states
          ui.ledBtns.forEach(b => b.classList.remove('led-btn-active'));
          // Set clicked active
          btn.classList.add('led-btn-active');

          // Send exact RGB WS Command matching backend parsing
          sendCmd({
            cmd: 'rgb',
            r: parseInt(btn.dataset.r),
            g: parseInt(btn.dataset.g),
            b: parseInt(btn.dataset.b)
          });

          // Auto-close modal shortly after picking a color
          setTimeout(closeLedModal, 250);
        });
      });

      // Global pointer cancel safely triggers STOP if dragging outside buttons
      document.addEventListener('pointerup', stopCommand);
      document.addEventListener('pointercancel', stopCommand);
    }

    // --- Boot Sequence ---
    initSpeedBars();
    attachEventListeners();
    startArmLoop();

  </script>
</body>
</html>
