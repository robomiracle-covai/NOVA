<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --jarvis-cyan: #00f2ff;
            --jarvis-bg: #030a12;
            --glow: 0 0 15px rgba(0, 242, 255, 0.5);
        }

        body {
            background-color: var(--jarvis-bg);
            color: var(--jarvis-cyan);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-panel {
            background: rgba(0, 242, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0, 242, 255, 0.05), var(--glow);
        }

        .key {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid rgba(0, 242, 255, 0.3);
            text-shadow: var(--glow);
            transition: all 0.2s;
        }

        .key:active {
            transform: scale(0.9);
            background: var(--jarvis-cyan);
            color: #000;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>

<body>
    <div class="grid-bg"></div>

    <div class="glass-panel p-8 w-80 flex flex-col items-center">
        <h2 class="orbitron text-xl mb-2 tracking-widest">AUTHENTICATION</h2>
        <div class="h-1 w-20 bg-cyan-500 mb-6 shimmer"></div>

        <div id="pin-display"
            class="w-full bg-black/50 border border-cyan-500/50 h-16 flex items-center justify-center gap-4 mb-8">
            <div class="dot w-3 h-3 rounded-full border border-cyan-500"></div>
            <div class="dot w-3 h-3 rounded-full border border-cyan-500"></div>
            <div class="dot w-3 h-3 rounded-full border border-cyan-500"></div>
            <div class="dot w-3 h-3 rounded-full border border-cyan-500"></div>
        </div>

        <div class="grid grid-cols-3 gap-4 w-full">
            <button onclick="press(1)" class="key h-12 rounded orbitron text-lg">1</button>
            <button onclick="press(2)" class="key h-12 rounded orbitron text-lg">2</button>
            <button onclick="press(3)" class="key h-12 rounded orbitron text-lg">3</button>
            <button onclick="press(4)" class="key h-12 rounded orbitron text-lg">4</button>
            <button onclick="press(5)" class="key h-12 rounded orbitron text-lg">5</button>
            <button onclick="press(6)" class="key h-12 rounded orbitron text-lg">6</button>
            <button onclick="press(7)" class="key h-12 rounded orbitron text-lg">7</button>
            <button onclick="press(8)" class="key h-12 rounded orbitron text-lg">8</button>
            <button onclick="press(9)" class="key h-12 rounded orbitron text-lg">9</button>
            <button onclick="clearPin()" class="key h-12 rounded text-xs orbitron text-red-400">CLR</button>
            <button onclick="press(0)" class="key h-12 rounded orbitron text-lg">0</button>
            <button onclick="cancel()" class="key h-12 rounded text-xs orbitron text-gray-400">ESC</button>
        </div>

        <p id="msg" class="mt-6 text-[10px] uppercase tracking-widest opacity-60">Security Level: Alpha</p>
    </div>

    <script>
        let pin = "";
        const dots = document.querySelectorAll('.dot');

        function press(num) {
            if (pin.length < 4) {
                pin += num;
                updateDots();
                if (pin.length === 4) verify();
            }
        }

        function updateDots() {
            dots.forEach((dot, i) => {
                if (i < pin.length) {
                    dot.classList.add('bg-cyan-500');
                    dot.classList.remove('border-cyan-500');
                } else {
                    dot.classList.remove('bg-cyan-500');
                    dot.classList.add('border-cyan-500');
                }
            });
        }

        function clearPin() {
            pin = "";
            updateDots();
            document.getElementById('msg').innerText = "Security Level: Alpha";
            document.getElementById('msg').classList.remove('text-red-500');
        }

        function verify() {
            if (pin === "1122") {
                document.getElementById('msg').innerText = "ACCESS GRANTED";
                document.getElementById('msg').classList.add('text-green-500');
                setTimeout(() => {
                    if (window.AndroidLauncher) {
                        window.AndroidLauncher.setAuthorized(true);
                        window.AndroidLauncher.bypassSettingsLock();
                    }
                    // Stay on current page or redirect back to home after intent is launched
                    window.location.href = "index.html";
                }, 400);
            } else {
                document.getElementById('msg').innerText = "INVALID CREDENTIALS";
                document.getElementById('msg').classList.add('text-red-500');
                pin = "";
                setTimeout(updateDots, 500);
            }
        }

        function cancel() {
            window.location.href = "index.html";
        }
    </script>
</body>

</html>
