<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA COMMAND - HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --jarvis-cyan: #00f2ff;
            --jarvis-bg: #030a12;
            --glow: 0 0 15px rgba(0, 242, 255, 0.5);
        }

        body {
            background-color: var(--jarvis-bg);
            color: var(--jarvis-cyan);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* Loading Screen Styles */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #0a192f 0%, #030a12 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-out;
        }

        .arc-reactor {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid var(--jarvis-cyan);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--glow), inset var(--glow);
            animation: pulse 2s infinite ease-in-out;
        }

        .arc-inner {
            width: 100px;
            height: 100px;
            border: 6px dashed var(--jarvis-cyan);
            border-radius: 50%;
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        .glass-panel {
            background: rgba(0, 242, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.15);
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0, 242, 255, 0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .interactive-card:hover {
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--jarvis-cyan);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.2), inset 0 0 15px rgba(0, 242, 255, 0.1);
            cursor: pointer;
            transform: translateY(-5px);
        }

        .interactive-card:active { transform: scale(0.98); }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            body { font-size: 14px; overflow-y: auto; }
            #main-ui { height: auto; min-height: 100vh; overflow-y: auto; }
        }
    </style>
</head>

<body class="flex flex-col">

    <div class="grid-bg"></div>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <div class="arc-reactor">
            <div class="arc-inner"></div>
            <div class="absolute font-bold orbitron text-lg">NOVA</div>
        </div>
        <div class="mt-8 text-center px-4">
            <h1 class="orbitron text-xl md:text-2xl tracking-widest text-white uppercase">Nova Command</h1>
            <p class="text-xs tracking-[0.3em] uppercase opacity-60 mt-2">Initializing Hub...</p>
            <div class="w-48 md:w-64 h-1 bg-gray-900 mt-4 overflow-hidden relative mx-auto">
                <div id="load-progress" class="absolute left-0 top-0 h-full bg-cyan-400 w-0 transition-all duration-100"></div>
            </div>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <main id="main-ui" class="hidden h-screen p-4 md:p-8 flex-col opacity-0 transition-opacity duration-1000 max-w-[1200px] mx-auto w-full box-border">

        <!-- Global Header -->
        <header class="flex flex-col md:flex-row justify-between items-center border-b border-cyan-900 pb-4 mb-8 shrink-0 gap-4">
            <div id="secret-header" class="text-center md:text-left cursor-pointer select-none" title="Click 4 times">
                <h2 class="orbitron text-2xl md:text-3xl font-bold tracking-tighter">NOVA <span class="text-white">COMMAND</span></h2>
                <p class="text-[10px] tracking-[0.4em] uppercase opacity-50">Operational Nexus</p>
            </div>
        </header>

        <!-- Studio Selection Grid -->
        <div class="flex-1 flex flex-col items-center justify-center p-2">
            <div class="flex flex-col md:flex-row gap-8 w-full justify-center items-stretch">
                
                <!-- Robot Studio Card -->
                <div onclick="window.location.href='robot.html'" class="glass-panel interactive-card flex-1 flex flex-col items-center justify-center text-center p-8 md:p-16 group relative overflow-hidden">
                    <div class="absolute inset-0 bg-cyan-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    
                    <div class="mb-6 p-6 rounded-full border border-cyan-500/20 group-hover:border-cyan-400/50 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 md:w-24 md:h-24 text-cyan-500/50 group-hover:text-cyan-400 transition-colors duration-300 relative z-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="10" rx="2" />
                            <circle cx="12" cy="5" r="2" />
                            <path d="M12 7v4" />
                            <line x1="8" y1="16" x2="8" y2="16" />
                            <line x1="16" y1="16" x2="16" y2="16" />
                        </svg>
                    </div>

                    <h2 class="orbitron text-2xl md:text-3xl font-bold tracking-wider text-white mb-3 relative z-10">ROBOT STUDIO</h2>
                    <div class="h-1 w-16 bg-cyan-500/50 mb-4 group-hover:w-32 group-hover:bg-cyan-400 transition-all duration-500 relative z-10"></div>
                    <p class="text-xs md:text-sm tracking-widest uppercase opacity-60 relative z-10 max-w-[200px]">Development, Control & AI Management</p>
                </div>

                <!-- Reception Studio Card -->
                <div onclick="window.location.href='reception.html'" class="glass-panel interactive-card flex-1 flex flex-col items-center justify-center text-center p-8 md:p-16 group relative overflow-hidden">
                    <div class="absolute inset-0 bg-blue-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    
                    <div class="mb-6 p-6 rounded-full border border-blue-500/20 group-hover:border-blue-400/50 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 md:w-24 md:h-24 text-blue-500/50 group-hover:text-blue-400 transition-colors duration-300 relative z-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                        </svg>
                    </div>

                    <h2 class="orbitron text-2xl md:text-3xl font-bold tracking-wider text-white mb-3 relative z-10">RECEPTION HUB</h2>
                    <div class="h-1 w-16 bg-blue-500/50 mb-4 group-hover:w-32 group-hover:bg-blue-400 transition-all duration-500 relative z-10"></div>
                    <p class="text-xs md:text-sm tracking-widest uppercase opacity-60 relative z-10 max-w-[200px]">Guest Interactions & Service Interface</p>
                </div>

            </div>
        </div>

        <!-- Global Footer -->
        <footer class="mt-8 flex justify-between items-center text-[10px] opacity-40 uppercase tracking-[0.3em] shrink-0 border-t border-cyan-900/50 pt-4">
            <div>Nova OS v4.0.2 Premium</div>
            <div id="clock">00:00:00</div>
        </footer>

        <!-- PASSWORD MODAL -->
        <div id="password-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[2000] flex items-center justify-center opacity-0 transition-opacity duration-300">
            <div class="glass-panel p-8 flex flex-col items-center w-80 max-w-[90vw]">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-red-500 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <h3 class="orbitron text-lg text-white mb-6 tracking-widest text-center">RESTRICTED ACCESS</h3>
                <input type="password" id="secret-password" class="w-full bg-cyan-900/20 border border-cyan-500/50 rounded px-4 py-3 text-center text-cyan-400 focus:outline-none focus:border-cyan-300 focus:bg-cyan-900/40 orbitron tracking-[0.5em] text-xl mb-6 transition-all" placeholder="****">
                <div class="flex gap-4 w-full">
                    <button onclick="checkPassword()" class="flex-1 bg-cyan-900/50 hover:bg-cyan-800 border border-cyan-500/50 text-cyan-100 rounded py-2 transition-colors orbitron text-xs tracking-wider">VERIFY</button>
                    <button onclick="closePasswordPopup()" class="flex-1 bg-red-900/30 hover:bg-red-900/60 border border-red-500/50 text-red-400 rounded py-2 transition-colors orbitron text-xs tracking-wider">CANCEL</button>
                </div>
                <p id="pwd-error" class="text-red-500 text-[10px] tracking-widest uppercase mt-4 opacity-0 transition-opacity">Invalid Code</p>
            </div>
        </div>
    </main>

    <script>
        const loadingScreen = document.getElementById('loading-screen');
        const mainUI = document.getElementById('main-ui');
        const loadProgress = document.getElementById('load-progress');

        // Startup Simulation
        window.onload = async () => {
            // Fake progress bar
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    completeLoading();
                }
                loadProgress.style.width = `${progress}%`;
            }, 150);

            startClock();
        };

        function completeLoading() {
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    mainUI.classList.remove('hidden');
                    mainUI.classList.add('flex');
                    setTimeout(() => mainUI.style.opacity = '1', 50);
                }, 1000);
            }, 500);
        }

        function startClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
            }, 1000);
        }

        // --- SECRET HEADER & PASSWORD LOGIC ---
        let headerClickCount = 0;
        let clickTimer;

        document.getElementById('secret-header').addEventListener('click', () => {
            headerClickCount++;
            clearTimeout(clickTimer);
            
            // Reset count if they don't click quickly enough (1.5 second window)
            clickTimer = setTimeout(() => {
                headerClickCount = 0;
            }, 1500);

            if (headerClickCount === 4) {
                headerClickCount = 0;
                showPasswordPopup();
            }
        });

        const modal = document.getElementById('password-modal');
        const pwdInput = document.getElementById('secret-password');
        const pwdError = document.getElementById('pwd-error');

        function showPasswordPopup() {
            modal.classList.remove('hidden');
            // Trigger reflow for CSS transition
            void modal.offsetWidth;
            modal.classList.add('opacity-100');
            pwdInput.value = '';
            pwdError.classList.add('opacity-0');
            pwdInput.focus();
        }

        function closePasswordPopup() {
            modal.classList.remove('opacity-100');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function checkPassword() {
            if (pwdInput.value === '1122') {
                // Navigate to previous page in browser history
                if (window.history.length > 1 && document.referrer) {
                    window.location.href='index.html';
                } else {
                    // Fallback if browser history is empty
                    window.location.href = 'index.html'; 
                }
            } else {
                // Show Error Animation
                pwdInput.classList.add('border-red-500', 'text-red-500');
                pwdInput.classList.remove('border-cyan-500/50', 'text-cyan-400');
                pwdError.classList.remove('opacity-0');
                
                setTimeout(() => {
                    pwdInput.classList.remove('border-red-500', 'text-red-500');
                    pwdInput.classList.add('border-cyan-500/50', 'text-cyan-400');
                    pwdError.classList.add('opacity-0');
                    pwdInput.value = '';
                    pwdInput.focus();
                }, 1500);
            }
        }

        // Allow pressing Enter to submit password
        pwdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
