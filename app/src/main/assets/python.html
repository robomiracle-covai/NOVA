<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Studio Code - Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Add PrismJS for Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');

        :root {
            --vscode-bg: #1e1e1e;
            --vscode-sidebar: #252526;
            --vscode-activityBar: #333333;
            --vscode-statusBar: #007acc;
            --vscode-tabsBg: #2d2d2d;
            --vscode-border: #3c3c3c;
            --vscode-text: #cccccc;
            --vscode-text-muted: #8b949e;
            --vscode-activeTab: #1e1e1e;
            --vscode-hover: #2a2d2e;
            --vscode-selection: rgba(38, 79, 120, 0.6);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--vscode-bg);
            color: var(--vscode-text);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #424242;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4f4f4f;
        }
        ::-webkit-scrollbar-corner {
            background: transparent;
        }

        .code-font {
            font-family: 'Fira Code', Consolas, Monaco, 'Courier New', monospace;
            font-size: 14px;
            line-height: 24px;
        }

        /* Line numbers selection prevention */
        .line-numbers {
            user-select: none;
            text-align: right;
        }

        .tab.active {
            background-color: var(--vscode-activeTab);
            color: #ffffff;
            border-top: 1px solid #007fd4;
        }

        /* Textarea Selection styling for the Overlay Technique */
        #code-editor::selection {
            background-color: var(--vscode-selection);
            color: transparent;
        }

        /* PrismJS VS Code Dark+ Syntax Highlighting Theme */
        code[class*="language-"], pre[class*="language-"] {
            color: #d4d4d4;
            text-shadow: none;
            direction: ltr;
            text-align: left;
            white-space: pre;
            word-spacing: normal;
            word-break: normal;
            tab-size: 4;
            hyphens: none;
            background: transparent;
            margin: 0;
            border: none;
        }
        .token.comment, .token.prolog, .token.doctype, .token.cdata { color: #6a9955; }
        .token.punctuation { color: #d4d4d4; }
        .token.namespace { opacity: .7; }
        .token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol, .token.deleted { color: #b5cea8; }
        .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin, .token.inserted { color: #ce9178; }
        .token.operator, .token.entity, .token.url, .language-css .token.string, .style .token.string { color: #d4d4d4; }
        .token.atrule, .token.attr-value, .token.keyword { color: #569cd6; }
        .token.function, .token.class-name { color: #dcdcaa; }
        .token.regex, .token.important, .token.variable { color: #9cdcfe; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-[13px] select-none">

    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Editor Area -->
        <div class="flex-1 flex flex-col min-w-0 bg-[#1e1e1e]">
            
            <!-- Tabs -->
            <div class="flex items-center justify-between bg-[#252526] h-[35px] border-b border-[#1e1e1e]">
                <div class="flex h-full overflow-x-auto no-scrollbar" id="editor-tabs">
                    <div class="tab active flex items-center px-3 py-1 cursor-pointer border-r border-[#252526] min-w-fit gap-1.5 text-[#8b949e]">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg" class="w-3.5 h-3.5" alt="Python">
                        app.py
                    </div>
                </div>
                <div class="flex items-center pr-3 gap-2">
                    <button id="run-button" class="flex items-center gap-1.5 text-[#cccccc] hover:text-white px-2 py-1 rounded hover:bg-white/10 transition-colors" title="Run Python File">
                        <i data-lucide="play" class="w-3.5 h-3.5 text-[#89d185] fill-[#89d185]" id="run-icon"></i>
                        <span class="text-xs font-medium" id="run-text">Run</span>
                    </button>
                </div>
            </div>

            <!-- Breadcrumbs with Back Button -->
            <div class="h-[22px] flex items-center px-4 text-[#cccccc] text-[12px] shadow-[0_4px_4px_-4px_rgba(0,0,0,0.5)] z-10 bg-[#1e1e1e]">
                <button onclick="window.location.href='learn.html'" class="hover:bg-[#333333] p-0.5 rounded mr-2 flex items-center justify-center text-[#cccccc] hover:text-white transition-colors border border-transparent hover:border-[#444]" title="Go Back">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                </button>
                <div class="w-[1px] h-3.5 bg-[#444] mr-2"></div>

                <span class="hover:underline cursor-pointer">src</span>
                <i data-lucide="chevron-right" class="w-3 h-3 mx-1 opacity-60"></i>
                <span id="breadcrumb-file" class="hover:underline cursor-pointer flex items-center gap-1">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg" class="w-3 h-3" alt="icon">
                    app.py
                </span>
            </div>

            <!-- Code/Terminal Split Container -->
            <div class="flex-1 flex flex-col min-h-0">
                
                <!-- Code Editors -->
                <div class="flex-1 overflow-hidden bg-[#1e1e1e] flex code-font relative" id="code-container">
                    
                    <!-- Line Numbers Container -->
                    <div class="w-[50px] flex-shrink-0 bg-[#1e1e1e] text-[#858585] py-2 line-numbers border-r border-transparent overflow-hidden" id="line-numbers">
                        <!-- Filled by JS -->
                    </div>

                    <!-- Editor Wrapper for Overlay Technique -->
                    <div class="relative flex-1 overflow-hidden" id="editor-wrapper">
                        <!-- Highlight Layer (Bottom) -->
                        <pre id="highlight-layer" class="absolute inset-0 m-0 py-2 px-4 pointer-events-none overflow-hidden z-0" aria-hidden="true"><code id="highlight-code" class="language-python"></code></pre>
                        
                        <!-- Text Input Layer (Top) -->
                        <textarea id="code-editor" class="absolute inset-0 bg-transparent text-transparent caret-[#d4d4d4] py-2 px-4 outline-none resize-none whitespace-pre z-10 overflow-auto code-font m-0 border-none" spellcheck="false"># Native Android Python Environment
import sys
import os

print(f"Python Version: {sys.version}")
print(f"Running natively on Android via Chaquopy!")

# Standard packages like requests, socket, and websocket-client 
# will work without throwing WebAssembly Errno 50 errors.

print("\nListing files in current app directory:")
for f in os.listdir("."):
    print(" - " + f)
</textarea>
                    </div>
                </div>

                <!-- Bottom Panel (Terminal) -->
                <div class="h-[250px] bg-[#1e1e1e] border-t border-[#3c3c3c] flex flex-col flex-shrink-0 relative group">
                    <div class="absolute top-[-2px] left-0 w-full h-[4px] cursor-row-resize z-10"></div>
                    
                    <!-- Panel Tabs -->
                    <div class="flex items-center px-4 h-[35px] text-[11px] gap-6 uppercase tracking-wider text-[#cccccc] bg-[#252526]">
                        <span class="hover:text-white cursor-pointer opacity-70">Problems <span class="ml-1 bg-[#ffffff1a] rounded-full px-1.5 py-0.5 text-[9px]">0</span></span>
                        <span class="text-white cursor-pointer border-b border-[#007acc] h-full flex items-center">Terminal</span>
                        
                        <div class="ml-auto flex gap-2 text-[#cccccc] opacity-80">
                            <i data-lucide="plus" class="w-4 h-4 cursor-pointer hover:bg-white/10 rounded p-0.5"></i>
                            <i data-lucide="split-square-vertical" class="w-4 h-4 cursor-pointer hover:bg-white/10 rounded p-0.5"></i>
                            <i data-lucide="trash-2" class="w-4 h-4 cursor-pointer hover:bg-white/10 rounded p-0.5" onclick="document.getElementById('terminal-history').innerHTML = '';"></i>
                            <i data-lucide="chevron-up" class="w-4 h-4 cursor-pointer hover:bg-white/10 rounded p-0.5"></i>
                            <i data-lucide="x" class="w-4 h-4 cursor-pointer hover:bg-white/10 rounded p-0.5"></i>
                        </div>
                    </div>
                    
                    <!-- Terminal Content -->
                    <div class="flex-1 overflow-auto p-4 code-font text-[13px] text-[#cccccc] select-text bg-[#1e1e1e]" id="terminal-content" onclick="document.getElementById('terminal-input').focus()">
                        
                        <div id="terminal-history">
                            <div class="text-[#e5c07b] mb-4" id="loading-msg">Connecting to Native Python runtime...</div>
                        </div>

                        <!-- Interactive Terminal Input Line -->
                        <div class="flex items-center text-[#569cd6] mt-2 hidden" id="terminal-prompt-line">
                            <span>~/project</span>
                            <span class="text-white mx-2">$</span>
                            <input type="text" id="terminal-input" class="bg-transparent border-none outline-none text-[#cccccc] flex-1 font-inherit p-0 focus:ring-0" autocomplete="off" spellcheck="false" disabled>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="h-[22px] bg-[#007acc] text-white flex items-center justify-between px-2 text-[11px] flex-shrink-0 z-20">
        <div class="flex items-center h-full gap-1">
            <div class="flex items-center hover:bg-[#1f8ad2] px-1.5 h-full cursor-pointer gap-1">
                <i data-lucide="git-branch" class="w-3.5 h-3.5"></i> main
            </div>
            <div class="flex items-center hover:bg-[#1f8ad2] px-1.5 h-full cursor-pointer gap-1">
                <i data-lucide="refresh-cw" class="w-3 h-3"></i>
            </div>
            <div class="flex items-center hover:bg-[#1f8ad2] px-1.5 h-full cursor-pointer gap-1">
                <i data-lucide="x-circle" class="w-3.5 h-3.5"></i> 0
                <i data-lucide="alert-triangle" class="w-3.5 h-3.5 ml-1"></i> 0
            </div>
        </div>
        
        <div class="flex items-center h-full gap-1">
            <div class="flex items-center hover:bg-[#1f8ad2] px-1.5 h-full cursor-pointer" id="cursor-pos">Ln 1, Col 1</div>
            <div class="flex items-center hover:bg-[#1f8ad2] px-1.5 h-full cursor-pointer">Spaces: 4</div>
            <div class="flex items-center hover:bg-[#1f8ad2] px-1.5 h-full cursor-pointer">UTF-8</div>
            <div class="flex items-center hover:bg-[#1f8ad2] px-1.5 h-full cursor-pointer">LF</div>
            <div class="flex items-center hover:bg-[#1f8ad2] px-1.5 h-full cursor-pointer font-bold" id="status-language">Python</div>
            <div class="flex items-center hover:bg-[#1f8ad2] px-1.5 h-full cursor-pointer gap-1">
                <i data-lucide="check-check" class="w-3.5 h-3.5"></i> Prettier
            </div>
            <div class="flex items-center hover:bg-[#1f8ad2] px-1.5 h-full cursor-pointer">
                <i data-lucide="bell" class="w-3.5 h-3.5"></i>
            </div>
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // DOM Elements
        const lineNumbersContainer = document.getElementById('line-numbers');
        const codeEditor = document.getElementById('code-editor');
        const highlightLayer = document.getElementById('highlight-layer');
        const highlightCodeElement = document.getElementById('highlight-code');
        const runButton = document.getElementById('run-button');
        const runText = document.getElementById('run-text');
        const terminalContent = document.getElementById('terminal-content');
        const terminalHistory = document.getElementById('terminal-history');
        const terminalInput = document.getElementById('terminal-input');
        const terminalPromptLine = document.getElementById('terminal-prompt-line');
        const cursorPos = document.getElementById('cursor-pos');

        // Native Python Terminal State
        let currentOutputBlock = null;

        // Terminal Helper
        function printToTerminal(html) {
            terminalHistory.insertAdjacentHTML('beforeend', html);
            terminalContent.scrollTop = terminalContent.scrollHeight;
        }

        // Set up global stream receivers for Native Android Python IO
        window.pythonStdout = (text) => {
            if (currentOutputBlock) {
                // Ensure text is explicitly wrapped in a span with the correct white/gray color
                const span = document.createElement('span');
                span.className = 'text-[#cccccc] font-inherit';
                span.appendChild(document.createTextNode(text));
                currentOutputBlock.appendChild(span);
                terminalContent.scrollTop = terminalContent.scrollHeight;
            } else {
                printToTerminal(`<span class="text-[#cccccc] whitespace-pre-wrap font-inherit">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>`);
            }
        };

        window.pythonStderr = (text) => {
            if (currentOutputBlock) {
                // Ensure text is explicitly wrapped in a span with the correct red color
                const span = document.createElement('span');
                span.className = 'text-red-400 font-inherit';
                span.appendChild(document.createTextNode(text));
                currentOutputBlock.appendChild(span);
                terminalContent.scrollTop = terminalContent.scrollHeight;
            } else {
                printToTerminal(`<span class="text-red-400 whitespace-pre-wrap font-inherit">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>`);
            }
        };

        function initNativePython() {
            const loadingMsg = document.getElementById('loading-msg');
            if (loadingMsg) loadingMsg.remove();
            
            const timestamp = new Date().toLocaleTimeString();
            printToTerminal(`
                <div class="text-[10px] text-[#6a9955] mb-1">[${timestamp}]</div>
                <div class="text-[#89d185] mb-4">Native Android Python environment ready!<br>
                <span class="text-[#8b949e]">Full device access (Bluetooth, Raw WebSockets) enabled.<br>Try 'pip install &lt;package&gt;', 'pip list', or 'python app.py'</span></div>
            `);

            terminalPromptLine.classList.remove('hidden');
            terminalInput.disabled = false;
            terminalInput.focus();
        }

        // Simulate short loading delay for UI feeling
        setTimeout(initNativePython, 800);

        // Interactive Terminal Logic
        terminalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = terminalInput.value;
                terminalInput.value = '';

                const cmd = val.trim();
                printToTerminal(`
                    <div class="flex items-center text-[#569cd6] mt-2 mb-1">
                        <span>~/project</span><span class="text-white mx-2">$</span>
                        <span class="text-white">${val}</span>
                    </div>
                `);

                if (!cmd) return;

                if (cmd.startsWith('pip install ')) {
                    const pkgs = cmd.substring(12).trim().split(/\s+/).filter(p => p);
                    if (pkgs.length === 0) return;

                    printToTerminal(`<div class="text-[#cccccc] mt-1 mb-1 font-inherit">Executing PIP via Python runtime...</div>`);
                    
                    terminalInput.disabled = true;
                    // Provide a blank container that children span elements will dictate colors for
                    currentOutputBlock = document.createElement('div');
                    currentOutputBlock.className = 'whitespace-pre-wrap mb-4 font-inherit';
                    terminalHistory.appendChild(currentOutputBlock);

                    if (window.AndroidLauncher) {
                        const pkgList = pkgs.map(p => `"${p}"`).join(", ");
                        
                        // FIX: Pip spawns background threads (for downloading, progress bars, etc).
                        // Background threads calling print() cross the JNI bridge unattached and throw "frame does not exist".
                        // Solution: Buffer the output completely in Python memory during execution, then print it all from the main thread!
                        const pyCode = `
import sys
import io
import os

# Buffer outputs
old_stdout = sys.stdout
old_stderr = sys.stderr
sys.stdout = out_buf = io.StringIO()
sys.stderr = err_buf = io.StringIO()

try:
    packages = [${pkgList}]

    # Patch Chaquopy AssetPath for pip importlib.metadata compatibility
    try:
        import java.android.importer
        if hasattr(java.android.importer, 'AssetPath') and not hasattr(java.android.importer.AssetPath, 'parent'):
            import pathlib
            java.android.importer.AssetPath.parent = property(lambda self: pathlib.Path(str(self)).parent)
    except Exception:
        pass

    from pip._internal import main as pipmain
    target_dir = os.path.join(os.getcwd(), 'python_libs')
    
    # Disable progress bar and colors to prevent complex threading & ANSI issues
    pipmain(["install", "--target", target_dir, "--disable-pip-version-check", "--no-color", "--progress-bar", "off"] + packages)
except Exception as e:
    print(f"Exception during pip execution: {e}", file=err_buf)
finally:
    # Restore stdout/stderr
    sys.stdout = old_stdout
    sys.stderr = old_stderr
    
    # Safely print everything from the attached main thread
    out_text = out_buf.getvalue()
    err_text = err_buf.getvalue()
    
    if out_text:
        print(out_text)
    if err_text:
        print(err_text, file=sys.stderr)
`;
                        window.AndroidLauncher.runPythonScript(pyCode);
                    } else {
                        printToTerminal(`<div class="text-red-400 mb-2 font-inherit">Android interface not available.</div>`);
                    }

                    setTimeout(() => {
                        currentOutputBlock = null;
                        terminalInput.disabled = false;
                        terminalInput.focus();
                        terminalContent.scrollTop = terminalContent.scrollHeight;
                    }, 1500);

                } else if (cmd === 'pip list') {
                    printToTerminal(`<div class="text-[#cccccc] mt-1 mb-1 font-inherit">Listing packages...</div>`);
                    
                    terminalInput.disabled = true;
                    // Provide a blank container that children span elements will dictate colors for
                    currentOutputBlock = document.createElement('div');
                    currentOutputBlock.className = 'whitespace-pre-wrap mb-4 font-inherit';
                    terminalHistory.appendChild(currentOutputBlock);

                    if (window.AndroidLauncher) {
                        // FIX: Applying the same buffer protection to pip list to be completely safe.
                        const pyCode = `
import sys
import io

old_stdout = sys.stdout
old_stderr = sys.stderr
sys.stdout = out_buf = io.StringIO()
sys.stderr = err_buf = io.StringIO()

try:
    import pkg_resources
    print(f"{'Package':<30} {'Version'}")
    print("-" * 40)
    for dist in sorted(pkg_resources.working_set, key=lambda x: x.project_name.lower()):
        print(f"{dist.project_name:<30} {dist.version}")
except ImportError:
    try:
        from pip._internal import main as pipmain
        pipmain(["list", "--no-color"])
    except Exception as e:
        print(f"Error listing packages via pipmain: {e}", file=err_buf)
except Exception as e:
    print(f"Error listing packages: {e}", file=err_buf)
finally:
    sys.stdout = old_stdout
    sys.stderr = old_stderr
    out_text = out_buf.getvalue()
    err_text = err_buf.getvalue()
    
    if out_text:
        print(out_text)
    if err_text:
        print(err_text, file=sys.stderr)
`;
                        window.AndroidLauncher.runPythonScript(pyCode);
                    } else {
                        printToTerminal(`<div class="text-red-400 mb-2 font-inherit">Android interface not available.</div>`);
                    }

                    setTimeout(() => {
                        currentOutputBlock = null;
                        terminalInput.disabled = false;
                        terminalInput.focus();
                        terminalContent.scrollTop = terminalContent.scrollHeight;
                    }, 1500);

                } else if (cmd === 'python app.py' || cmd === 'python3 app.py') {
                    runButton.click();
                } else if (cmd === 'clear') {
                    terminalHistory.innerHTML = '';
                } else if (cmd.startsWith('python')) {
                    printToTerminal(`<div class="text-[#cccccc] mb-2 font-inherit">Native Android Python<br><span class="text-yellow-400">Hint: Use the editor above to write scripts, then run 'python app.py'</span></div>`);
                } else {
                    printToTerminal(`<div class="text-red-400 mb-2 font-inherit">Command not found: ${cmd}.<br>Available commands: 'python app.py', 'pip install &lt;pkg&gt;', 'pip list', 'clear'</div>`);
                }
                
                terminalContent.scrollTop = terminalContent.scrollHeight;
            }
        });

        // Terminal REAL Python Run Logic using AndroidLauncher
        runButton.addEventListener('click', () => {
            runButton.disabled = true;
            runButton.classList.add('opacity-50', 'cursor-not-allowed');
            runText.innerText = "Running...";
            terminalInput.disabled = true;

            const code = codeEditor.value;

            printToTerminal(`
                <div class="flex items-center text-[#569cd6] mb-1 mt-3">
                    <span>~/project</span><span class="text-white mx-2">$</span>
                    <span class="text-[#858585]">python app.py</span>
                </div>
            `);

            // Provide a blank container that children span elements will dictate colors for
            currentOutputBlock = document.createElement('div');
            currentOutputBlock.className = 'whitespace-pre-wrap mb-4 font-inherit';
            terminalHistory.appendChild(currentOutputBlock);

            if (window.AndroidLauncher) {
                window.AndroidLauncher.runPythonScript(code);
            } else {
                printToTerminal(`<div class="text-red-400 mb-2 font-inherit">Android interface not available. Cannot execute Python natively.</div>`);
            }

            setTimeout(() => {
                currentOutputBlock = null;
                runButton.disabled = false;
                runButton.classList.remove('opacity-50', 'cursor-not-allowed');
                runText.innerText = "Run";
                terminalInput.disabled = false;
                terminalInput.focus();
                terminalContent.scrollTop = terminalContent.scrollHeight;
            }, 1000); 
        });

        // --- Editor Visual Features (Syntax Highlighting & Formatting) ---
        function updateSyntaxHighlighting() {
            let code = codeEditor.value;
            if (code[code.length - 1] === "\n") code += " ";
            let escapedCode = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            highlightCodeElement.innerHTML = escapedCode;
            Prism.highlightElement(highlightCodeElement);
        }

        function updateLineNumbers() {
            const lines = codeEditor.value.split('\n').length;
            let lineNumbersHTML = '';
            const totalLines = Math.max(40, lines);
            for (let i = 1; i <= totalLines; i++) lineNumbersHTML += `<div>${i}</div>`;
            lineNumbersContainer.innerHTML = lineNumbersHTML;
        }

        codeEditor.addEventListener('scroll', () => {
            lineNumbersContainer.scrollTop = codeEditor.scrollTop;
            highlightLayer.scrollTop = codeEditor.scrollTop;
            highlightLayer.scrollLeft = codeEditor.scrollLeft;
        });

        function updateCursorPosition() {
            const textLines = codeEditor.value.substr(0, codeEditor.selectionStart).split("\n");
            const currentLine = textLines.length;
            const currentCol = textLines[textLines.length - 1].length + 1;
            cursorPos.innerText = `Ln ${currentLine}, Col ${currentCol}`;
        }
        
        codeEditor.addEventListener('keyup', updateCursorPosition);
        codeEditor.addEventListener('click', updateCursorPosition);
        codeEditor.addEventListener('input', () => {
            updateLineNumbers();
            updateSyntaxHighlighting();
            updateCursorPosition();
        });

        codeEditor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                updateLineNumbers();
                updateSyntaxHighlighting();
            }
        });

        updateLineNumbers();
        updateSyntaxHighlighting();

    </script>
</body>
</html>
